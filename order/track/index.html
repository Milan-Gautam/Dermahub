<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Track Your Order | DERMAHUB</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --cream:#fefaf5; --sand:#f3ede7; --olive:#3a5a45; --deep-olive:#2a4235; --warm-brown:#9c6e4b; --charcoal:#2c2b28; --stone:#8b7b6e; --border-light:#ece2d9; }
  body { font-family:'Inter',sans-serif; background:#f5f0eb; min-height:100vh; color:var(--charcoal); -webkit-font-smoothing:antialiased; }
  .top-bar { background:white; border-bottom:1px solid var(--border-light); padding:16px 0; }
  .top-bar .container { max-width:680px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; }
  .logo-link { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--warm-brown); text-decoration:none; font-weight:600; }
  .back-link { font-size:0.8rem; color:var(--stone); text-decoration:none; }
  .wrap { max-width:680px; margin:0 auto; padding:32px 20px 60px; }
  .card { background:white; border-radius:24px; padding:28px 24px; box-shadow:0 4px 20px rgba(0,0,0,0.04); border:1px solid var(--border-light); }
  .card h1 { font-family:'Playfair Display',serif; font-size:1.5rem; color:var(--deep-olive); margin-bottom:6px; }
  .card p.sub { color:var(--stone); font-size:0.85rem; margin-bottom:22px; line-height:1.6; }
  .field { margin-bottom:14px; text-align:left; }
  .field label { display:block; font-size:0.68rem; font-weight:600; color:var(--charcoal); text-transform:uppercase; margin-bottom:5px; }
  .field input { width:100%; padding:11px 14px; border:1px solid var(--border-light); border-radius:10px; font-size:0.88rem; font-family:inherit; }
  .field input:focus { outline:none; border-color:var(--olive); }
  .btn-main { background:var(--deep-olive); color:white; border:none; border-radius:50px; padding:13px 24px; font-weight:600; font-size:0.9rem; cursor:pointer; min-height:46px; }
  .btn-main:hover { background:var(--warm-brown); }
  .btn-main:disabled { background:#cbbcac; cursor:not-allowed; }
  .msg { font-size:0.78rem; margin-top:14px; padding:10px 14px; border-radius:10px; display:none; line-height:1.5; }
  .msg.error { background:#fdecea; color:#c0392b; display:block; }
  .state { display:none; }
  .state.active { display:block; }

  .exception-banner { border-radius:14px; padding:14px 18px; margin:20px 0; font-size:0.85rem; font-weight:600; display:flex; align-items:center; gap:10px; }
  .exception-banner.cancelled, .exception-banner.failed { background:#fdecea; color:#c0392b; }
  .exception-banner.returned { background:#f0e6f6; color:#6a3d9a; }
  .exception-banner.refunded { background:#e0d5f5; color:#5b3a8c; }
  .status-track { display:flex; justify-content:space-between; margin:24px 0 28px; position:relative; }
  .status-track::before { content:''; position:absolute; top:14px; left:0; right:0; height:3px; background:var(--border-light); z-index:0; }
  .status-track .fill { position:absolute; top:14px; left:0; height:3px; background:var(--olive); z-index:1; transition:width 0.4s; }
  .status-step { position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:6px; flex:1; }
  .status-step .dot { width:28px; height:28px; border-radius:50%; background:var(--border-light); color:white; display:flex; align-items:center; justify-content:center; font-size:0.7rem; }
  .status-step.done .dot { background:var(--olive); }
  .status-step .label { font-size:0.62rem; color:var(--stone); text-align:center; font-weight:600; text-transform:uppercase; }
  .status-step.done .label { color:var(--olive); }

  .order-meta { background:var(--cream); border-radius:14px; padding:16px 18px; margin-bottom:18px; font-size:0.85rem; line-height:1.8; }
  .order-meta strong { color:var(--deep-olive); }
  .item-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-light); gap:10px; }
  .item-row:last-child { border-bottom:none; }
  .item-row .iname { font-weight:600; font-size:0.85rem; }
  .item-row .imeta { font-size:0.72rem; color:var(--stone); }
  .item-row .badge { padding:3px 10px; border-radius:20px; font-size:0.62rem; font-weight:700; text-transform:capitalize; white-space:nowrap; }
  .badge.ordered, .badge.pending { background:#e8e0f7; color:#5b3a8c; }
  .badge.paid, .badge.confirmed { background:#cce5ff; color:#004085; }
  .badge.processing { background:#fff3cd; color:#856404; }
  .badge.packed { background:#ffe0b2; color:#a15c00; }
  .badge.shipped { background:#b8daff; color:#004085; }
  .badge.out_for_delivery { background:#c9e3ff; color:#004085; }
  .badge.delivered { background:#d4edda; color:#155724; }
  .badge.cancelled, .badge.failed { background:#fdecea; color:#c0392b; }
  .badge.returned { background:#f0e6f6; color:#6a3d9a; }
  .badge.refunded { background:#e0d5f5; color:#5b3a8c; }
  .actions-row { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .btn-secondary-link { flex:1; text-align:center; background:none; border:1px solid var(--border-light); border-radius:50px; padding:11px; font-size:0.82rem; font-weight:600; color:var(--deep-olive); text-decoration:none; min-width:140px; }
  .btn-secondary-link:hover { border-color:var(--warm-brown); color:var(--warm-brown); }
  @media (max-width:480px) { .status-step .label { font-size:0.56rem; } .status-track .dot { width:24px; height:24px; } }
</style>
</head>
<body>
  <div class="top-bar"><div class="container"><a href="/" class="logo-link">DERMAHUB</a><a href="/" class="back-link"><i class="fas fa-arrow-left"></i> Back to store</a></div></div>

  <div class="wrap">

    <!-- LOOKUP -->
    <div class="card state active" id="lookupState">
      <h1>Track Your Order</h1>
      <p class="sub">Enter your Order ID and the email you used at checkout.</p>
      <div class="field"><label>Order ID</label><input type="text" id="lookupOrderId" placeholder="ORD-..."></div>
      <div class="field"><label>Email</label><input type="email" id="lookupEmail" placeholder="you@example.com"></div>
      <button class="btn-main" id="findOrderBtn">Track Order</button>
      <div class="msg" id="lookupMsg"></div>
    </div>

    <!-- ORDER DETAILS -->
    <div class="card state" id="orderState">
      <h1 id="orderTitle">Order Status</h1>
      <p class="sub" id="orderSubDate"></p>

      <div class="exception-banner" id="exceptionBanner" style="display:none;"></div>

      <div class="status-track" id="statusTrack">
        <div class="fill" id="statusFill" style="width:0%;"></div>
        <div class="status-step" data-stage="0"><div class="dot"><i class="fas fa-receipt"></i></div><div class="label">Pending</div></div>
        <div class="status-step" data-stage="1"><div class="dot"><i class="fas fa-check"></i></div><div class="label">Confirmed</div></div>
        <div class="status-step" data-stage="2"><div class="dot"><i class="fas fa-box-open"></i></div><div class="label">Processing</div></div>
        <div class="status-step" data-stage="3"><div class="dot"><i class="fas fa-box"></i></div><div class="label">Packed</div></div>
        <div class="status-step" data-stage="4"><div class="dot"><i class="fas fa-truck"></i></div><div class="label">Shipped</div></div>
        <div class="status-step" data-stage="5"><div class="dot"><i class="fas fa-truck-fast"></i></div><div class="label">Out for Delivery</div></div>
        <div class="status-step" data-stage="6"><div class="dot"><i class="fas fa-circle-check"></i></div><div class="label">Delivered</div></div>
      </div>

      <div class="order-meta" id="orderMeta"></div>

      <div id="itemsList"></div>

      <div class="actions-row">
        <a href="/order/return" class="btn-secondary-link"><i class="fas fa-rotate-left"></i> Request a Return</a>
        <a href="/" class="btn-secondary-link"><i class="fas fa-store"></i> Continue Shopping</a>
      </div>
    </div>

  </div>

<script>
(function(){
  const SUPABASE_URL = "https://hduvbdexggqjweebjjbh.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkdXZiZGV4Z2dxandlZWJqamJoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMzc1ODcsImV4cCI6MjA5NzgxMzU4N30.Q86M_6eFdrsVQK8f4SD3oLL5h8Tba6aIyJqSfQZBUFc";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const STAGES = ['pending','confirmed','processing','packed','shipped','out_for_delivery','delivered'];
  const EXCEPTION_STAGES = { cancelled: {icon:'fa-ban', text:'This order was cancelled.'}, failed: {icon:'fa-triangle-exclamation', text:'This order could not be completed.'}, returned: {icon:'fa-rotate-left', text:'This order was returned.'}, refunded: {icon:'fa-circle-dollar-to-slot', text:'This order was refunded.'} };

  function showState(id){ document.querySelectorAll('.state').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
  function showMsg(id, text){ const el=document.getElementById(id); el.textContent=text; el.className='msg error'; }
  function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]); }

  // Auto-fill from a tracking link like track.html?orderId=ORD-123&email=you@example.com
  const params = new URLSearchParams(window.location.search);
  if(params.get('orderId')) document.getElementById('lookupOrderId').value = params.get('orderId');
  if(params.get('email')) document.getElementById('lookupEmail').value = params.get('email');

  document.getElementById('findOrderBtn').addEventListener('click', trackOrder);
  if(params.get('orderId') && params.get('email')) trackOrder();

  async function trackOrder(){
    const orderId = document.getElementById('lookupOrderId').value.trim();
    const email = document.getElementById('lookupEmail').value.trim();
    if(!orderId || !email){ showMsg('lookupMsg','Enter your Order ID and email.'); return; }
    const btn = document.getElementById('findOrderBtn');
    btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
    try {
      const { data: orderResults, error } = await db.rpc('get_order_for_tracking', { p_order_id: orderId, p_email: email });
      const order = orderResults && orderResults.length ? orderResults[0] : null;
      if(error || !order) throw new Error('No matching order found. Double-check your Order ID and email.');

      let items = [];
      try {
        const { data: itemsData } = await db.rpc('get_order_items_for_return', { p_order_id: orderId, p_email: email });
        items = itemsData || [];
      } catch(e) { /* falls back to the plain items summary below */ }

      renderOrder(order, items);
      showState('orderState');
    } catch(e) {
      showMsg('lookupMsg', e.message || 'Could not find that order.');
    }
    btn.disabled = false; btn.innerHTML = 'Track Order';
  }

  function renderOrder(order, items){
    document.getElementById('orderTitle').textContent = `Order #${(order.orderId||'').slice(-8)}`;
    document.getElementById('orderSubDate').textContent = order.date ? `Placed on ${new Date(order.date).toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}` : '';

    const status = (order.status || 'pending').toLowerCase();
    const banner = document.getElementById('exceptionBanner');
    const track = document.getElementById('statusTrack');
    if(status in EXCEPTION_STAGES){
      const ex = EXCEPTION_STAGES[status];
      banner.className = 'exception-banner ' + status;
      banner.innerHTML = `<i class="fas ${ex.icon}"></i> ${ex.text}`;
      banner.style.display = 'flex';
      track.style.display = 'none';
    } else {
      banner.style.display = 'none';
      track.style.display = 'flex';
      const stageIndex = Math.max(0, STAGES.indexOf(status));
      document.getElementById('statusFill').style.width = (stageIndex / (STAGES.length-1) * 100) + '%';
      document.querySelectorAll('.status-step').forEach(step => {
        const idx = parseInt(step.dataset.stage);
        step.classList.toggle('done', idx <= stageIndex);
      });
    }

    document.getElementById('orderMeta').innerHTML = `
      <div><strong>Receiver:</strong> ${esc(order.customerName)}</div>
      <div><strong>Delivery:</strong> ${esc(order.location)}</div>
      <div><strong>Address:</strong> ${esc(order.address)}</div>
      <div><strong>Total:</strong> NPR ${parseFloat(order.total||0).toLocaleString()}</div>
    `;

    const listEl = document.getElementById('itemsList');
    if(items && items.length){
      let html = '';
      items.forEach(item => {
        const itemStatus = (item.fulfillment_status || 'pending').toLowerCase();
        const itemStatusLabel = itemStatus.split('_').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
        html += `<div class="item-row">
          <div><div class="iname">${esc(item.product_name)}${item.variant_label?` <small style="color:var(--stone);">(${esc(item.variant_label)})</small>`:''}</div><div class="imeta">Qty: ${item.quantity} · NPR ${parseFloat(item.line_total||0).toLocaleString()}</div></div>
          <span class="badge ${itemStatus}">${itemStatusLabel}</span>
        </div>`;
      });
      listEl.innerHTML = html;
    } else {
      listEl.innerHTML = `<div class="order-meta" style="margin-bottom:0;"><strong>Items:</strong> ${esc(order.items)}</div>`;
    }
  }
})();
</script>
</body>
</html>
