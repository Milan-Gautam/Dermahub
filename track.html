<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DERMAKRAFT | Track Order</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#f5f0eb;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .card{background:white;border-radius:24px;padding:32px 24px;max-width:500px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.06);}
        h1{font-family:'Playfair Display',serif;color:#9c6e4b;margin-bottom:8px;font-size:1.8rem;}
        .status-bar{display:flex;justify-content:space-between;margin:28px 0;position:relative;}
        .status-bar::before{content:'';position:absolute;top:18px;left:0;width:100%;height:3px;background:#ece2d9;z-index:0;}
        .status-step{z-index:1;text-align:center;flex:1;}
        .step-circle{width:36px;height:36px;border-radius:50%;background:#ece2d9;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:14px;color:white;font-weight:700;}
        .step-circle.done{background:#3a5a45;}
        .step-circle.current{background:#9c6e4b;box-shadow:0 0 0 6px rgba(156,110,75,0.2);}
        .step-label{font-size:0.6rem;color:#8b7b6e;text-transform:uppercase;font-weight:600;}
        .info-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #ece2d9;font-size:0.85rem;text-align:left;}
        .info-label{color:#8b7b6e;}
        .info-value{font-weight:600;color:#2c2b28;}
        .btn{display:inline-block;background:#2a4235;color:white;padding:12px 24px;border-radius:50px;text-decoration:none;font-weight:600;margin-top:20px;font-size:0.9rem;}
        .btn:hover{background:#9c6e4b;}
        .not-found{color:#c27c6e;padding:20px;}
        .delivered-msg{background:#d4edda;color:#155724;padding:12px;border-radius:12px;margin-top:16px;font-size:0.85rem;}
    </style>
</head>
<body>
<div class="card">
    <h1>📦 Track Your Order</h1>
    <div id="trackContent"><p>Loading...</p></div>
    <a href="index.html" class="btn">← Back to Store</a>
</div>
<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');
    let data = JSON.parse(localStorage.getItem('track_' + orderId) || 'null');
    
    if (data && data.status === 'delivered') {
        const deliveredDate = new Date(data.date);
        const hoursSinceDelivery = (Date.now() - deliveredDate.getTime()) / (1000 * 60 * 60);
        if (hoursSinceDelivery > 24) { localStorage.removeItem('track_' + orderId); data = null; }
    }
    
    if (!data) {
        document.getElementById('trackContent').innerHTML = '<p class="not-found">❌ Order not found or tracking expired.<br><small>Delivered orders are removed after 24 hours.</small></p>';
    } else {
        const status = data.status || 'ordered';
        const steps = [
            { label: 'Ordered', done: true },
            { label: 'Processing', done: status === 'processing' || status === 'shipped' || status === 'delivered' },
            { label: 'Shipped', done: status === 'shipped' || status === 'delivered' },
            { label: 'Delivered', done: status === 'delivered' }
        ];
        let bar = '<div class="status-bar">';
        steps.forEach((s, i) => {
            let cls = '';
            if (s.done) cls += 'done ';
            const firstIncomplete = steps.findIndex(x => !x.done);
            if (i === firstIncomplete) cls += 'current';
            if (i === steps.length - 1 && s.done) cls += 'current';
            bar += `<div class="status-step"><div class="step-circle ${cls.trim()}">${s.done ? '✓' : i + 1}</div><div class="step-label">${s.label}</div></div>`;
        });
        bar += '</div>';
        let deliveredNote = '';
        if (status === 'delivered') { deliveredNote = '<div class="delivered-msg">✅ Your order has been delivered!<br><small>Tracking will expire in 24 hours.</small></div>'; }
        document.getElementById('trackContent').innerHTML = `${bar}${deliveredNote}<div style="margin-top:20px;"><div class="info-row"><span class="info-label">Order ID</span><span class="info-value">#${data.orderId.slice(-8)}</span></div><div class="info-row"><span class="info-label">Items</span><span class="info-value">${data.items}</span></div><div class="info-row"><span class="info-label">Total</span><span class="info-value">NPR ${parseFloat(data.total).toLocaleString()}</span></div><div class="info-row"><span class="info-label">Location</span><span class="info-value">${data.location}</span></div><div class="info-row"><span class="info-label">Date</span><span class="info-value">${new Date(data.date).toLocaleDateString()}</span></div><div class="info-row"><span class="info-label">Status</span><span class="info-value" style="color:#9c6e4b;">${data.status.toUpperCase()}</span></div></div>`;
    }
</script>
</body>
</html>
